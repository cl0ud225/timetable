<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이동수업 시간표</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  text-align: center;
  padding: 20px;
}

table {
  margin: 20px auto;
  border-collapse: collapse;
  width: 95%;
  max-width: 900px;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 13px;
}

th {
  background: #4a6cff;
  color: white;
}

.period {
  background: #eee;
  font-weight: bold;
}

td {
  background: #fff;
}

.set {
  font-weight: bold;
  font-size: 15px;
  color: #4a6cff;
  display: block;
  margin-bottom: 4px;
}

input, button {
  padding: 8px 12px;
  margin: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
button {
  background: #4a6cff;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>📚 이동수업 시간표</h2>

<input type="text" id="studentId" placeholder="학번 입력">
<button onclick="generate()">조회</button>

<div id="tableArea"></div>

<script>

// 주간 세트표

  ["자율","E","A","A","A"],

  B: { 월:["정보","컴퓨터실","홍*"], 화:["골프","3층 C실","허범*"], 수:["환경","3층 C실","오이*"], 목:["정보","컴퓨터실","홍*"] },
  C: { 월:["정보","컴퓨터실","홍*"], 화:["골프","5반","허범*"], 수:["정보","컴퓨터실","홍*"], 금:["환경","5반","오이*"] },
  D: { 월:["정보","컴퓨터실","홍*"], 화:["환경","3반","오이*"], 목:["정보","컴퓨터실","홍*"], 금:["골프","3반","허범*"] },
  E: { 화:["골프","1반","허범*"], 수:["정보","컴퓨터실","홍*"], 목:["정보","컴퓨터실","홍*"], 금:["환경","1반","오이*"] },
  F: { 월:["환경","2반","오이*"], 수:["정보","컴퓨터실","홍*"], 목:["정보","컴퓨터실","홍*"], 금:["골프","2반","허범*"] },
  G: { 월:["환경","3층 B실","오이*"], 수:["정보","컴퓨터실","홍*"], 목:["골프","3층 B실","허범*"], 금:["정보","컴퓨터실","홍*"] }
};

const students = {

    G:["생활과과학","6반","김기*"],
    H:["보건","3반","김소*"]
  },
  "3202": {

    B:["미적분","1반","민병*"],

    D:["사회문화","3층 B실","*정아"],
    E:["체육/정보/환경","4반",""],
    F:["영어 독해와 작문","4반","최용*"],
    G:["사회문제탐구","3반","오예*"],

  },
  "3312": {
    A:["영어 독해와 작문","3반","최용*"],
    B:["화학2","5반","이래*"],
    C:["미적분","3반","김나*"],
    D:["생명과학2","과학실","송*"],
    E:["사회문제탐구","5반","오예*"],
    F:["언어와 매체","6반","김예*"],
    G:["체육/정보/환경","3층 B실",""],
    H:["보건","4반","문현*"]
  },
  "3512": {
    A:["생활과과학","3층 C실","김형*"],
    B:["지구과학2","3반","김기*"],
    C:["여행지리","6반","진성*"],
    D:["한국지리","3층 B실","김진*"],
    E:["과학사","3층 C실","임종*"],
    F:["경제수학","3반","박종*"],
    G:["체육/정보/환경","3층 B실",""],
    H:["논술","도서실","*정아"]
  },
  "3517": {
    A:["생활과과학","3층 C실","김형*"],
    B:["융합과학","4반","이래*"],
    C:["사회문제탐구","3층 B실","이지*"],
    D:["체육/정보/환경","3반",""],

    E:["영어회화","4반","안재*"],

  },

    D:["과학사","과학실","임종*"],

    G:["생명과학2","5반","송*"],
    H:["인공지능수학","수학실","김진*"]
  },
  "3627": {
    A:["영미문학읽기","3층 B실","임희*"],
    B:["영어권문화","6반","최용*"],
    C:["수학탐구과제","2반","민병*"],
    D:["언어와매체","2반","최서*"],
    E:["체육/정보/환경","1반",""],
    F:["여행지리","3층 C실","진성*"],
    G:["생활과과학","6반","김기*"],
    H:["논술","1반","김기*"]
  }
};

function generate() {
  const id = document.getElementById("studentId").value;
  const area = document.getElementById("tableArea");

  if (!students[id]) {
    area.innerHTML = "❌ 학번을 찾을 수 없습니다.";
    return;
  }

  let html = "<table>";
  html += "<tr><th>교시</th>";
  days.forEach(d => html += `<th>${d}</th>`);
  html += "</tr>";

  weekly.forEach((row, i) => {
    html += `<tr><td class="period">${i+1}교시</td>`;

    row.forEach((cell, colIndex) => {

      if (students[id][cell]) {

        let subject = students[id][cell][0];
        let room = students[id][cell][1];
        let teacher = students[id][cell][2];

        const dayName = days[colIndex];

        // 체육/정보/환경이면 요일별 변경
        if (subject === "체육/정보/환경" && peMapping[cell] && peMapping[cell][dayName]) {
          subject = peMapping[cell][dayName][0];
          room = peMapping[cell][dayName][1];
          teacher = peMapping[cell][dayName][2];
        }

        html += `
          <td>
            <span class="set">${cell}</span>
            ${subject} | ${room} | ${teacher}
          </td>
        `;
      } else {
        html += `<td>${cell}</td>`;
      }

    });

    html += "</tr>";
  });

  html += "</table>";
  area.innerHTML = html;
}
</script>

</body>
</html>
